<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="The phone talks to Vercel functions in Tokyo, which check the session with Supabase Auth and query Postgres through the Supabase Data API, both in Tokyo. Only the Claude API call leaves the Tokyo boundary. GitHub pushes trigger Vercel deploys; the laptop runs migrations and backups.">
        <style>
  svg { --fg: #1b2230; --muted: #5b6577; --line: #c9cfd9; --panel: #ffffff; --tokyo: #3f51b5; --supa: #2f8f63; --out: #c26a00;
    color: var(--fg); font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { svg { --fg: #e4e8ef; --muted: #9aa4b5; --line: #3a4352; --panel: #1b212b; --tokyo: #8c9cf0; --supa: #5cc595; --out: #f0a345; } }
  .bg { fill: var(--panel); }
  .m { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace !important; }

  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .region { fill: none; stroke: var(--tokyo); stroke-width: 1.6; stroke-dasharray: 7 5; }
  .grp-vercel { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.2; }
  .grp-supa { fill: none; stroke: var(--supa); stroke-width: 1.4; }
  .band { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
  .t { fill: currentColor; font-size: 13px; font-weight: 600; }
  .s { fill: var(--muted); font-size: 11.5px; }
  .m { fill: currentColor;  font-size: 11.5px; }
  .lbl { fill: currentColor; font-size: 11.5px; font-weight: 500; }
  .lbl-muted { fill: var(--muted); font-size: 11px; }
  .rlabel { fill: var(--tokyo); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .slabel { fill: var(--supa); font-size: 12px; font-weight: 600; }
  .vlabel { fill: currentColor; font-size: 12px; font-weight: 600; }
  .blabel { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .edge { fill: none; stroke: currentColor; stroke-width: 1.4; }
  .edge-out { fill: none; stroke: var(--out); stroke-width: 1.8; }
  .lbl-out { fill: var(--out); font-size: 11.5px; font-weight: 600; }
  .head { fill: currentColor; }
  .head-out { fill: var(--out); }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.4; }
</style>
        <rect class="bg" width="1200" height="740"/>
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
          <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-out" d="M0 0 L10 5 L0 10 z"/></marker>
        </defs>

        <!-- Phone -->
        <rect class="box" x="24" y="115" width="126" height="90" rx="8"/>
        <rect class="ic" x="40" y="132" width="20" height="34" rx="4"/>
        <line class="ic" x1="46" y1="160" x2="54" y2="160"/>
        <text class="t" x="70" y="146">Phone</text>
        <text class="s" x="70" y="164">browser</text>
        <text class="s" x="40" y="190">Japan · Malaysia</text>

        <!-- Tokyo region -->
        <rect class="region" x="220" y="40" width="660" height="500" rx="10"/>
        <text class="rlabel" x="236" y="64">TOKYO · JAPAN</text>

        <!-- Vercel -->
        <rect class="grp-vercel" x="245" y="80" width="310" height="410" rx="8"/>
        <path class="head" d="M261 104 l7 -12 l7 12 z"/>
        <text class="vlabel" x="282" y="104">Vercel · hnd1</text>

        <rect class="box" x="275" y="125" width="250" height="70" rx="6"/>
        <text class="t" x="291" y="152">Edge proxy</text>
        <text class="m" x="291" y="174">proxy.ts</text>
        <text class="s" x="355" y="174">refreshes session</text>

        <rect class="box" x="275" y="250" width="250" height="210" rx="6"/>
        <text class="t" x="291" y="276">Next.js functions</text>
        <text class="s" x="291" y="302">Pages (Server Components)</text>
        <text class="s" x="291" y="324">Server Actions: add, edit, import</text>
        <text class="m" x="291" y="346">/api/chat</text>
        <line x1="291" y1="364" x2="509" y2="364" stroke="currentColor" stroke-opacity=".15"/>
        <text class="m" x="291" y="386">requireUser()</text>
        <text class="s" x="291" y="404">first line of every page,</text>
        <text class="s" x="291" y="420">action and route</text>

        <!-- Supabase -->
        <rect class="grp-supa" x="585" y="80" width="270" height="410" rx="8"/>
        <text class="slabel" x="601" y="104">Supabase · ap-northeast-1</text>

        <rect class="box" x="615" y="125" width="210" height="70" rx="6"/>
        <text class="t" x="631" y="152">Auth</text>
        <text class="s" x="631" y="174">1 user · sign-ups off</text>

        <rect class="box" x="615" y="250" width="210" height="60" rx="6"/>
        <text class="t" x="631" y="274">Data API</text>
        <text class="s" x="631" y="294">PostgREST · 1000 rows/request</text>

        <rect class="box" x="615" y="360" width="210" height="100" rx="6"/>
        <text class="t" x="631" y="384">Postgres 17</text>
        <text class="m" x="631" y="404">expenses</text>
        <text class="m" x="631" y="422">expenses_history</text>
        <text class="s" x="631" y="442">triggers · RLS, no policies</text>

        <!-- Claude -->
        <rect class="box" x="940" y="270" width="230" height="100" rx="6"/>
        <text class="t" x="956" y="298">Claude API</text>
        <text class="s" x="956" y="318">Anthropic</text>
        <text class="m" x="956" y="346">claude-haiku-5-5</text>

        <!-- Request edges -->
        <line class="edge" x1="150" y1="160" x2="272" y2="160" marker-end="url(#a)"/>
        <text class="lbl" x="211" y="151" text-anchor="middle">① HTTPS</text>

        <line class="edge" x1="525" y1="160" x2="612" y2="160" marker-end="url(#a)"/>
        <text class="lbl" x="569" y="151" text-anchor="middle">② session</text>

        <line class="edge" x1="400" y1="195" x2="400" y2="247" marker-end="url(#a)"/>
        <text class="lbl" x="408" y="220">③ signed in</text>
        <text class="lbl-muted" x="408" y="236">else redirect /login</text>

        <line class="edge" x1="525" y1="280" x2="612" y2="280" marker-end="url(#a)"/>
        <text class="lbl" x="569" y="271" text-anchor="middle">④ queries</text>
        <text class="lbl-muted" x="569" y="298" text-anchor="middle">secret key</text>

        <line class="edge" x1="720" y1="310" x2="720" y2="357" marker-end="url(#a)"/>
        <text class="lbl" x="728" y="338">SQL</text>

        <path class="edge-out" d="M470 460 V512 H1055 V373" marker-end="url(#ao)"/>
        <text class="lbl-out" x="1065" y="440">⑤ messages.create</text>
        <text class="lbl-muted" x="1065" y="456">chat answers,</text>
        <text class="lbl-muted" x="1065" y="471">import categories</text>

        <!-- Build and operations -->
        <rect class="band" x="24" y="580" width="1152" height="140" rx="8"/>
        <text class="blabel" x="40" y="604">BUILD AND OPERATIONS</text>

        <rect class="box" x="290" y="620" width="170" height="70" rx="6"/>
        <text class="t" x="306" y="648">GitHub</text>
        <text class="m" x="306" y="670">main</text>

        <rect class="box" x="555" y="620" width="200" height="70" rx="6"/>
        <text class="t" x="571" y="648">Laptop (WSL)</text>
        <text class="m" x="571" y="670">supabase CLI · npm</text>

        <rect class="box" x="940" y="620" width="230" height="70" rx="6"/>
        <text class="t" x="956" y="648">Google Drive</text>
        <text class="s" x="956" y="670">backups · statement CSVs</text>

        <line class="edge" x1="555" y1="655" x2="463" y2="655" marker-end="url(#a)"/>
        <text class="lbl" x="509" y="646" text-anchor="middle">git push</text>

        <line class="edge" x1="375" y1="620" x2="375" y2="463" marker-end="url(#a)"/>
        <text class="lbl" x="383" y="565">auto build + deploy</text>

        <line class="edge" x1="680" y1="620" x2="680" y2="463" marker-end="url(#a)"/>
        <text class="lbl" x="688" y="565">migrations · backup</text>

        <line class="edge" x1="755" y1="655" x2="937" y2="655" marker-end="url(#a)"/>
        <text class="lbl" x="846" y="646" text-anchor="middle">monthly CSV</text>
      </svg>
